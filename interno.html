<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agente Interno</title>

</head>
<body>

            <input type="checkbox" id="legales"><label for="legales"> Asuntos Legales</label><br>
        </fieldset>
        <br>
        <fieldset>
            <legend>Grado de avance</legend>
            <input type="checkbox" id="inicio"><label for="inicio"> Inicio</label><br>
            <input type="checkbox" id="proceso"><label for="proceso"> En proceso</label><br>
            <input type="checkbox" id="finalizado"><label for="finalizado"> Finalizado</label><br>
